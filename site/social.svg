<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Spell Trail — spelling that feels like a walk, not a worksheet">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="630"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#afcfcb"/>
      <stop offset="58%" stop-color="#afcfcb"/>
      <stop offset="58%" stop-color="#7fb087"/>
      <stop offset="100%" stop-color="#7fb087"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="630" fill="#dce7d8"/>

    <!-- Reuse the same trail scene as the app and marketing-page hero. -->
    <image href="trail-scene.svg" x="660" y="0" width="540" height="630"
           preserveAspectRatio="xMidYMid slice"/>

    <!-- copy -->
    <g transform="translate(76 0)">
      <g transform="rotate(-3 46 122)">
        <rect x="10" y="90" width="76" height="76" rx="20" fill="#d7a847"/>
        <rect x="6" y="86" width="76" height="76" rx="20" fill="#173f37"/>
        <text x="44" y="138" text-anchor="middle" font-family="Manrope, Helvetica, sans-serif"
              font-size="38" font-weight="800" fill="#fff5dd">S</text>
      </g>
      <text x="102" y="122" font-family="Manrope, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#173f37">Spell Trail</text>
      <text x="102" y="150" font-family="DM Sans, Helvetica, sans-serif" font-size="16" fill="#52635d">spelltrail.app</text>

      <text font-family="Manrope, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#173f37" letter-spacing="-2">
        <tspan x="6" y="290">Spelling that feels</tspan>
        <tspan x="6" y="356">like a <tspan fill="#e56f3d">walk</tspan>, not</tspan>
        <tspan x="6" y="422">a worksheet.</tspan>
      </text>

      <text font-family="DM Sans, Helvetica, sans-serif" font-size="21" fill="#3f544c">
        <tspan x="6" y="480">Five-minute trails · 384 hand-authored words</tspan>
        <tspan x="6" y="512">No accounts · No ads · Open source</tspan>
      </text>
    </g>
  </g>
</svg>
